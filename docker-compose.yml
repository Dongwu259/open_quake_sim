# Earthquake Simulator Pro v4.2 — Docker Compose deployment
# Usage: docker-compose up -d

version: '3.8'

services:
  quake-sim:
    build: .
    container_name: quake-sim
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      # Persistent data files (survive container recreation)
      - ./counter.json:/app/counter.json
      - ./traffic.json:/app/traffic.json
      - ./daily_visits.json:/app/daily_visits.json
      - ./ratelimit.json:/app/ratelimit.json
      - ./api_keys.json:/app/api_keys.json
      - ./users.json:/app/users.json
      - ./webhooks.json:/app/webhooks.json
      - ./error_log.json:/app/error_log.json
      - ./admin_password.txt:/app/admin_password.txt
      - ./expiry.json:/app/expiry.json
    environment:
      - NODE_ENV=production
      - PORT=3000
      # Optional: set admin password (otherwise generated on first run)
      # - ADMIN_PASSWORD=your-secure-password
      # Optional: CORS origins (comma-separated)
      # - CORS_ORIGINS=https://your-domain.com
      # Optional: disable webhooks
      # - WEBHOOKS_ENABLED=false
      # Optional: disable rate limit persistence
      # - RATELIMIT_PERSIST=false
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    # Resource limits (adjust for your server)
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
