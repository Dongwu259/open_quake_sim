name: zenodo-v650
on:
  workflow_dispatch: {}
permissions: {}
jobs:
  deposit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download the v6.5.0 source archive (GitHub-generated, matches the v6.4.0 file shape)
        run: curl -fsSL -o /tmp/src.zip https://codeload.github.com/Dongwu259/open_quake_sim/zip/refs/tags/v6.5.0
      - name: Deposit and publish the Zenodo new version
        env:
          ZN_TOKEN: ${{ secrets.ZN_TOKEN }}
          ZIP_PATH: /tmp/src.zip
        run: node tools/zenodo-deposit-v650.js
