name: CI

# The primary remote is a bare backup repo on the production ECS, so this
# workflow only runs if/when the repo is mirrored to GitHub. The mandatory
# local gate is the pre-push hook (githooks/pre-push) + `npm run check`.
on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Unit & integration tests + physics/tsunami benchmark validators
        run: export NODE_OPTIONS=--max-old-space-size=2048; set -o pipefail && npm test 2>&1 | tee test-output.log
      - name: Report failing tests as annotations
        if: failure()
        run: |
          L=$(wc -l < test-output.log)
          S=$((L>24 ? L-24 : 1))
          CHUNK=0
          BUF=""
          sed -n "${S},\$p" test-output.log | while IFS= read -r line || [ -n "$line" ]; do
            BUF="$BUF$line%0A"
            CHUNK=$((CHUNK+1))
            if [ $CHUNK -ge 6 ]; then
              echo "::error title=logchunk::$BUF"
              CHUNK=0; BUF=""
            fi
          done
          [ -n "$BUF" ] && echo "::error title=logchunk-end::$BUF"
          echo "::error title=loglines::$L"
      - name: Release validation (versioned assets, PWA markers, i18n, a11y, data catalogs)
        run: set -o pipefail && node tools/validate-release.js 2>&1 | tee vr-output.log
      - name: Report release-validation failure details
        if: failure()
        run: |
          L=$(wc -l < vr-output.log)
          S=$((L>24 ? L-24 : 1))
          CHUNK=0
          BUF=""
          sed -n "${S},\$p" vr-output.log | while IFS= read -r line || [ -n "$line" ]; do
            BUF="$BUF$line%0A"
            CHUNK=$((CHUNK+1))
            if [ $CHUNK -ge 6 ]; then
              echo "::error title=vr-chunk::$BUF"
              CHUNK=0; BUF=""
            fi
          done
          [ -n "$BUF" ] && echo "::error title=vr-chunk-end::$BUF"
      - name: Cache-busting version gate
        run: node tools/bump-versions.js --check
      - name: Audio asset validation
        run: npm run validate:audio
      - name: GMPE accuracy scorecard (validate:accuracy)
        run: node tools/validate-accuracy.js
